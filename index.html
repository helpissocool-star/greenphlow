<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GreenPHlow — Marikina City GI Siting Tool</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <header id="header">
    <h1>GreenPHlow</h1>
    <p>Green Infrastructure Siting Tool — Marikina City</p>
  </header>

  <div id="controls">
    <div class="control-group">
      <label for="layerSelect">Subcatchment shading</label>
      <select id="layerSelect">
        <option value="runoff_2yr">Runoff — 2-yr storm</option>
        <option value="runoff_5yr">Runoff — 5-yr storm</option>
        <option value="runoff_10yr" selected>Runoff — 10-yr storm</option>
        <option value="cn_composite">Composite CN</option>
      </select>
    </div>

    <div class="control-group">
      <label for="giTypeFilter">Show GI type</label>
      <select id="giTypeFilter">
        <option value="all" selected>All types</option>
        <option value="bioswale">Bioswale</option>
        <option value="permeable_pavement">Permeable Pavement</option>
        <option value="urban_forest_patch">Urban Forest Patch</option>
      </select>
    </div>

    <div class="control-group">
      <label for="fundedFilter">Funding status</label>
      <select id="fundedFilter">
        <option value="all" selected>All sites</option>
        <option value="funded">Funded only</option>
        <option value="unfunded">Unfunded only</option>
      </select>
    </div>

    <div class="control-group search-group">
      <label for="siteSearch">Find a site (ID or barangay)</label>
      <input type="text" id="siteSearch" placeholder="e.g. Site 12 or Concepcion Uno" autocomplete="off" />
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="summary-panel">
    <h3>Summary</h3>
    <div id="summary-content">Loading...</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/map.js"></script>
</body>
</html>

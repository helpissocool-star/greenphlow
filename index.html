<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GreenPHlow — Mathematical Model for Flood Control Infrastracture Planning in Marikina City</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <header id="header">
    <h1>GreenPHlow</h1>
    <p>Mathematical Model for Flood Control Infrastracture Planning in Marikina City</p>
  </header>

  <div id="controls">
    <div class="control-group">
      <label for="layerSelect">Subcatchment shading</label>
      <select id="layerSelect">
        <option value="runoff_2yr">Runoff — 2-yr storm (mm)</option>
        <option value="runoff_5yr">Runoff — 5-yr storm (mm)</option>
        <option value="runoff_10yr" selected>Runoff — 10-yr storm (mm)</option>
        <option value="volume_2yr">Runoff Volume — 2-yr (m³)</option>
        <option value="volume_5yr">Runoff Volume — 5-yr (m³)</option>
        <option value="volume_10yr">Runoff Volume — 10-yr (m³)</option>
        <option value="cn_composite">Composite CN</option>
      </select>
    </div>

    <div class="control-group">
      <label for="scenarioSelect">Rainfall Scenario</label>
      <select id="scenarioSelect">
        <option value="2yr">2-Year Storm Scenario</option>
        <option value="5yr">5-Year Storm Scenario</option>
        <option value="10yr" selected>10-Year Storm Scenario</option>
      </select>
    </div>

    <div class="control-group">
      <label for="giTypeFilter">Show GI type</label>
      <select id="giTypeFilter">
        <option value="all" selected>All types</option>
        <option value="bioswale">Bioswale</option>
        <option value="permeable_pavement">Permeable Pavement</option>
        <option value="urban_forest_patch">Urban Forest Patch</option>
      </select>
    </div>

    <div class="control-group">
      <label for="fundedFilter">Funding status</label>
      <select id="fundedFilter">
        <option value="all" selected>All sites</option>
        <option value="funded_2yr">Funded (2-yr)</option>
        <option value="unfunded_2yr">Unfunded (2-yr)</option>
        <option value="funded_5yr">Funded (5-yr)</option>
        <option value="unfunded_5yr">Unfunded (5-yr)</option>
        <option value="funded_10yr">Funded (10-yr)</option>
        <option value="unfunded_10yr">Unfunded (10-yr)</option>
      </select>
    </div>

    <div class="control-group search-group">
      <label for="siteSearch">Find a site (ID or barangay)</label>
      <input type="text" id="siteSearch" placeholder="e.g. 12 or Tumana" autocomplete="off" />
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="summary-panel">
    <h3>Summary</h3>
    <div id="summary-content">Loading...</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/map.js"></script>
</body>
</html>
